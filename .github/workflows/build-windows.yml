name: Build Windows installer

on:
  workflow_dispatch:
    inputs:
      site_url:
        description: "Your SEAS website address, e.g. https://seas-ai-agent.pages.dev"
        required: false
        required: false
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Write website address
        if: ${{ github.event.inputs.site_url != '' }}
        shell: bash
        run: |
          echo '{"site": "${{ github.event.inputs.site_url }}"}' > site.json
      - run: npm install
      - run: npx electron-builder --win --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: SEAS-AI-AGENT-Setup
          path: dist/*.exe

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
