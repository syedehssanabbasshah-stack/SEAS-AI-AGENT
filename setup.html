<!doctype html><meta charset="utf-8"><title>SEAS-AI-AGENT</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#03070d;color:#d8eef5;font:16px "Segoe UI",system-ui,sans-serif}main{width:min(480px,92vw)}h1{letter-spacing:.3em;color:#37e6ff;font-size:22px}input,button{font:inherit;padding:10px 14px;border-radius:10px;border:1px solid #12394a;background:#08141d;color:#d8eef5;width:100%;box-sizing:border-box;margin-top:10px}button{background:#0b2a36;border-color:#37e6ff;cursor:pointer}#e{color:#ff8a98;min-height:1.4em}small{color:#6f93a1}</style>
<main><h1>SEAS-AI-AGENT</h1><p>Enter the address of your SEAS website (the Cloudflare address):</p><input id="u" placeholder="https://your-nexa.pages.dev" autofocus><button id="b">Open SEAS</button><p id="e"></p><small>You can change it later by deleting the file config.json in the SEAS-AI-AGENT app-data folder.</small></main>
<script>const q=new URLSearchParams(location.search);if(q.get('err'))e.textContent='Could not open the website ('+q.get('err')+'). Check the address and your internet.';if(q.get('site'))u.value=q.get('site');
b.onclick=async()=>{e.textContent='';try{await nexaSetup.save(u.value)}catch(x){e.textContent='That address does not look right.'}};u.onkeydown=ev=>{if(ev.key==='Enter')b.click()}</script>
