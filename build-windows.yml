name: Build Windows installer

on:
  workflow_dispatch:
    inputs:
      site_url:
        description: "Your SEAS website address, e.g. https://seas-ai-agent.pages.dev"
        required: false
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Write website address
        if: ${{ inputs.site_url != '' }}
        shell: bash
        run: echo '{ "site": "${{ inputs.site_url }}" }' > site.json

      - name: Install dependencies
        run: npm ci

      - name: Build Electron Windows App (.exe)
        run: npx electron-builder --win nsis --x64 -c.compression=maximum --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SEAS-AI-AGENT-Setup
          path: dist/*.exe

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe